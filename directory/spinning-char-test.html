<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>name orbs testing</title>
        <style>
            html,
            body {
                height: 100%;
            }

            body {
              background: black;
              color: white;
              overflow: hidden; // no scrollbars...
            }

            .orb-container {
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
            }


            .orb-chars-container {
              position: relative;
              --orb-chars-size: 2rem;
              --orbSize: 75px;
              --orbitDuration: 10s;
              transform-style: preserve-3d;
              perspective: 550px;
              perspective-origin: center;
            }

            .orb-chars-container > div {
                color: red;
                top: calc(50% - 0.5 * var(--orb-chars-size));
                left: calc(50% - 0.5 * var(--orb-chars-size));
                height: var(--orb-chars-size);
                width: var(--orb-chars-size);
                font-size: var(--orb-chars-size);
                text-align: center;
                line-height: var(--orb-chars-size);
                position: absolute;
                animation-name: orbit;
                animation-duration: var(--orbitDuration);
                animation-iteration-count: infinite;
                animation-timing-function: linear;
                animation-fill-mode: both;
                transform-style: preserve-3d;
            }

            .orb-name {
                transform: translateZ(0);
                font-size: 1.5rem;
            }

            @keyframes orbit {
                from {
                    animation-timing-function: ease-in;
                    transform: rotateX(0) rotateY(0) rotateZ(var(--orb-rotation)) translateZ(calc(-1 * var(--orbSize))) rotateZ(calc(-1 * var(--orbSize))) rotateY(0) rotateX(0);
                }
                10% {
                    transform: rotateX(var(--orb-tilt)) rotateY(90deg) rotateZ(var(--orb-rotation)) translateZ(calc(-1 * var(--orbSize))) rotateZ(calc(-1 * var(--orb-rotation))) rotateY(-90deg) rotateX(calc(-1 * var(--orb-tilt)));
                }
                50% {
                    transform: rotateX(var(--orb-tilt)) rotateY(990deg) rotateZ(var(--orb-rotation)) translateZ(calc(-1 * var(--orbSize))) rotateZ(calc(-1 * var(--orb-rotation))) rotateY(-990deg) rotateX(calc(-1 * var(--orb-tilt)));
                }
                to {
                    animation-timing-function: ease-out;
                    transform: rotateX(0) rotateY(1080deg) rotateZ(var(--orb-rotation)) translateZ(calc(-1 * var(--orbSize))) rotateZ(calc(-1 * var(--orbSize))) rotateY(-1080deg) rotateX(0);
                }
            }
            /*@keyframes orbit-test {
                start {
                    transform: rotateX(var(--orb-tilt)) rotateY(90deg) rotateZ(var(--orb-rotation)) translateZ(calc(-1 * var(--orbSize))) rotateZ(calc(-1 * var(--orb-rotation))) rotateY(-90deg) rotateX(calc(-1 * var(--orb-tilt)));
                }
                end {
                    transform: rotateX(var(--orb-tilt)) rotateY(990deg) rotateZ(var(--orb-rotation)) translateZ(calc(-1 * var(--orbSize))) rotateZ(calc(-1 * var(--orb-rotation))) rotateY(-990deg) rotateX(calc(-1 * var(--orb-tilt)));
                }
            }*/
        </style>
    </head>
    <body>
        <div class="orb-container">
            <div class="orb-chars-container">
                <span class="orb-name">ollie</span>
                <!--<div style="--orb-x: 720deg; --orb-y: 0; --orb-z: 0">X</div>-->
                <div style="--orb-tilt: 15deg; --orb-rotation: 1deg">Y</div>
                <!--<div style="--orb-x: 0; --orb-y: 0; --orb-z: 720deg">Z</div>-->
            </div>
        </div>
    </body>
</html>
